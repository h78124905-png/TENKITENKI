<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨ナウ デバッグ v2</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      padding: 16px;
      line-height: 1.5;
      font-size: 14px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 12px; }
    h2 { font-size: 1rem; margin: 20px 0 8px; color: #0066cc; }
    button {
      display: block;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: #0066cc;
      border: none;
      border-radius: 8px;
      margin-bottom: 12px;
      cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: #9ca3af; }
    .out {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 400px;
      overflow-y: auto;
    }
    .ok { color: #059669; font-weight: 700; }
    .ng { color: #dc2626; font-weight: 700; }
    .warn { color: #d97706; font-weight: 700; }
    .label { color: #6b7280; font-size: 11px; text-transform: uppercase; }
    .swatch {
      display: inline-block;
      width: 20px;
      height: 20px;
      vertical-align: middle;
      border: 1px solid #000;
      margin-right: 4px;
    }
    .color-line {
      display: flex;
      align-items: center;
      padding: 3px 0;
      gap: 8px;
      font-family: ui-monospace, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h1>雨ナウ デバッグ v2</h1>

  <p style="font-size:12px;color:#6b7280;margin-bottom:16px;">
    Blob経由の読み取りと、targetTimes_N1.json の中身確認用。
  </p>

  <button id="btn-times">⓪ targetTimes_N1.json の中身を見る</button>
  <div id="out-times" class="out">未実行</div>

  <button id="btn-cors">① CORSヘッダーを確認</button>
  <div id="out-cors" class="out">未実行</div>

  <button id="btn-blob">② Blob経由でピクセルを読む</button>
  <div id="out-blob" class="out">未実行</div>

  <button id="btn-extract">③ Blob経由で色を抽出</button>
  <div id="out-extract" class="out">未実行</div>

  <script>
    // ---- 座標（真庭市役所付近） ----
    const LAT = 35.0756;
    const LON = 133.7528;
    const ZOOM = 10;
    const BASE = 'https://www.jma.go.jp/bosai/jmatile/data';

    function lonLatToTileExact(lon, lat, z) {
      const n = 2 ** z;
      const xExact = ((lon + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const yExact =
        ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      return { xExact, yExact };
    }

    function utcStamp(d) {
      return (
        String(d.getUTCFullYear()) +
        String(d.getUTCMonth() + 1).padStart(2, '0') +
        String(d.getUTCDate()).padStart(2, '0') +
        String(d.getUTCHours()).padStart(2, '0') +
        String(d.getUTCMinutes()).padStart(2, '0') +
        String(d.getUTCSeconds()).padStart(2, '0')
      );
    }

    // ============================================================
    // ⓪ targetTimes_N1.json の中身を見る
    // ============================================================
    document.getElementById('btn-times').addEventListener('click', async () => {
      const out = document.getElementById('out-times');
      out.textContent = '取得中…';
      const lines = [];
      try {
        const url = `${BASE}/nowc/targetTimes_N1.json`;
        lines.push(`URL: ${url}`);
        lines.push('');
        const res = await fetch(url, { cache: 'no-store' });
        lines.push(`HTTPステータス: ${res.status}`);
        lines.push(`Content-Type: ${res.headers.get('content-type') ?? '（なし）'}`);
        lines.push('');

        const text = await res.text();
        lines.push(`レスポンス長: ${text.length} 文字`);
        lines.push('');
        lines.push('--- 先頭500文字 ---');
        lines.push(text.slice(0, 500));
        lines.push('');
        lines.push('--- 末尾200文字 ---');
        lines.push(text.slice(-200));

        // JSONとしてパースを試みる
        try {
          const json = JSON.parse(text);
          lines.push('');
          lines.push(`✅ JSONパース成功: 型=${Array.isArray(json) ? '配列' : typeof json}`);
          if (Array.isArray(json)) {
            lines.push(`件数: ${json.length}`);
            if (json.length > 0) {
              lines.push(`先頭3件:`);
              json.slice(0, 3).forEach((t, i) => {
                lines.push(`  [${i}] ${JSON.stringify(t)}`);
              });
              const tenses = [...new Set(json.map((t) => t.tense))];
              const elements = [...new Set(json.flatMap((t) => t.elements || []))];
              lines.push(`tense一覧: ${tenses.join(', ')}`);
              lines.push(`elements一覧: ${elements.join(', ')}`);
            }
          }
        } catch (e) {
          lines.push('');
          lines.push(`❌ JSONパース失敗: ${e.message}`);
        }

        out.textContent = lines.join('\n');
      } catch (e) {
        out.innerHTML = `❌ fetchエラー: ${e.message}\n（CORSまたはネットワーク問題）`;
      }
    });

    // ============================================================
    // ① CORSヘッダーを確認
    // ============================================================
    document.getElementById('btn-cors').addEventListener('click', async () => {
      const out = document.getElementById('out-cors');
      out.textContent = '取得中…';
      const lines = [];
      try {
        // targetTimesが動かない場合に備えて、実際に存在するタイルURLを使う
        const now = new Date();
        const base = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
          now.getUTCHours() - 1, 0, 0
        ));
        const bt = utcStamp(base);
        const vt = bt;
        const { xExact, yExact } = lonLatToTileExact(LON, LAT, ZOOM);
        const x = Math.floor(xExact);
        const y = Math.floor(yExact);
        const url = `${BASE}/nowc/${bt}/none/${vt}/surf/hrpns/${ZOOM}/${x}/${y}.png`;

        lines.push(`URL: ${url}`);
        lines.push('');

        const res = await fetch(url, { cache: 'no-store' });
        lines.push(`HTTPステータス: ${res.status}`);
        lines.push(`type: ${res.type}`);
        lines.push('');
        lines.push('--- レスポンスヘッダー ---');
        let hasCors = false;
        for (const [k, v] of res.headers.entries()) {
          lines.push(`${k}: ${v}`);
          if (k.toLowerCase() === 'access-control-allow-origin') hasCors = true;
        }
        lines.push('');
        if (hasCors) {
          lines.push('✅ Access-Control-Allow-Origin あり');
        } else {
          lines.push('❌ Access-Control-Allow-Origin なし');
          lines.push('→ canvas getImageData は SecurityError になる');
          lines.push('→ Blob経由の読み取りで回避可能');
        }
        out.textContent = lines.join('\n');
      } catch (e) {
        out.innerHTML = `❌ fetchエラー: ${e.message}`;
      }
    });

    // ============================================================
    // ② Blob経由でピクセルを読む
    // ============================================================
    document.getElementById('btn-blob').addEventListener('click', async () => {
      const out = document.getElementById('out-blob');
      out.textContent = '取得中…';
      try {
        const now = new Date();
        const base = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
          now.getUTCHours() - 1, 0, 0
        ));
        const bt = utcStamp(base);
        const { xExact, yExact } = lonLatToTileExact(LON, LAT, ZOOM);
        const tileX = Math.floor(xExact);
        const tileY = Math.floor(yExact);
        const px = Math.floor((xExact - tileX) * 256);
        const py = Math.floor((yExact - tileY) * 256);
        const url = `${BASE}/nowc/${bt}/none/${bt}/surf/hrpns/${ZOOM}/${tileX}/${tileY}.png`;

        // fetch → Blob → ObjectURL → img
        const res = await fetch(url, { cache: 'no-store' });
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error('画像読み込み失敗'));
          i.src = objectUrl;
        });

        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);

        const data = ctx.getImageData(px, py, 1, 1).data;
        URL.revokeObjectURL(objectUrl);

        out.innerHTML =
          `URL: ${url}\n` +
          `タイル: ${ZOOM}/${tileX}/${tileY}\n` +
          `ピクセル: (${px}, ${py})\n` +
          `RGBA: (${data[0]}, ${data[1]}, ${data[2]}, ${data[3]})\n\n` +
          (data[3] === 0 ? '→ 透明（降水なし）' : '→ 色あり（降水の可能性）') +
          `\n\n✅ Blob経由で getImageData 成功（SecurityErrorなし）`;
      } catch (e) {
        out.innerHTML = `❌ エラー: ${e.message}`;
      }
    });

    // ============================================================
    // ③ Blob経由で色を抽出
    // ============================================================
    document.getElementById('btn-extract').addEventListener('click', async () => {
      const out = document.getElementById('out-extract');
      out.textContent = '取得中…';
      try {
        const now = new Date();
        const base = new Date(Date.UTC(
          now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(),
          now.getUTCHours() - 1, 0, 0
        ));
        const bt = utcStamp(base);
        const { xExact, yExact } = lonLatToTileExact(LON, LAT, ZOOM);
        const x = Math.floor(xExact);
        const y = Math.floor(yExact);
        const url = `${BASE}/nowc/${bt}/none/${bt}/surf/hrpns/${ZOOM}/${x}/${y}.png`;

        const res = await fetch(url, { cache: 'no-store' });
        const blob = await res.blob();
        const objectUrl = URL.createObjectURL(blob);

        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error('画像読み込み失敗'));
          i.src = objectUrl;
        });

        const canvas = document.createElement('canvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0);

        const data = ctx.getImageData(0, 0, img.width, img.height).data;
        URL.revokeObjectURL(objectUrl);

        const counts = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a === 0) continue;
          const key = `${data[i]},${data[i + 1]},${data[i + 2]}`;
          counts.set(key, (counts.get(key) || 0) + 1);
        }

        const sorted = [...counts.entries()]
          .sort((a, b) => b[1] - a[1])
          .slice(0, 20);

        let html = `<div class="label">画像サイズ: ${img.width}×${img.height}</div>`;
        html += `<div class="label">非透明色の種類: ${counts.size}</div><br>`;
        if (sorted.length === 0) {
          html += '（このタイルは全面透明＝降水なし）';
        } else {
          html += '<div class="label">出現頻度上位20色:</div>';
          for (const [rgb, count] of sorted) {
            const [r, g, b] = rgb.split(',').map(Number);
            html += `<div class="color-line">` +
              `<span class="swatch" style="background:rgb(${r},${g},${b})"></span>` +
              `RGB(${r},${g},${b}) × ${count}` +
              `</div>`;
          }
        }
        out.innerHTML = html;
      } catch (e) {
        out.innerHTML = `❌ エラー: ${e.message}`;
      }
    });
  </script>
</body>
</html>
