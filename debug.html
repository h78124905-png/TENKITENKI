<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨ナウ デバッグ v2</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', sans-serif;
      background: #f5f7fa; color: #1a1a2e; padding: 16px; line-height: 1.5; font-size: 14px;
    }
    h1 { font-size: 1.2rem; margin-bottom: 12px; }
    button {
      display: block; width: 100%; padding: 12px; font-size: 1rem; font-weight: 600;
      color: #fff; background: #0066cc; border: none; border-radius: 8px;
      margin-bottom: 12px; cursor: pointer;
    }
    button:active { opacity: 0.8; }
    button:disabled { background: #9ca3af; }
    button.secondary { background: #fff; color: #0066cc; border: 1.5px solid #0066cc; }
    .out {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 12px; margin-bottom: 12px;
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px; white-space: pre-wrap; word-break: break-all;
      max-height: 400px; overflow-y: auto;
    }
    .ok { color: #059669; font-weight: 700; }
    .ng { color: #dc2626; font-weight: 700; }
    .warn { color: #d97706; font-weight: 700; }
    .label { color: #6b7280; font-size: 11px; text-transform: uppercase; }
    .coord-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .coord-row label { flex: 0 0 40px; font-size: 0.85rem; color: #6b7280; align-self: center; }
    .coord-row input {
      flex: 1; padding: 8px 10px; font-size: 1rem;
      border: 1px solid #d1d5db; border-radius: 6px; font-variant-numeric: tabular-nums;
    }
    .presets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .preset {
      font-size: 0.75rem; padding: 4px 10px; background: #eff6ff;
      color: #0066cc; border: 1px solid #bfdbfe; border-radius: 12px; cursor: pointer;
    }
    .preset:active { background: #dbeafe; }
  </style>
</head>
<body>
  <h1>雨ナウ デバッグ v2</h1>

  <div class="coord-row">
    <label>緯度</label>
    <input id="input-lat" type="number" step="0.0001" value="35.6812" />
  </div>
  <div class="coord-row">
    <label>経度</label>
    <input id="input-lon" type="number" step="0.0001" value="139.7671" />
  </div>
  <button id="btn-geo" class="secondary" style="margin-bottom:8px;">📍 現在地を取得</button>
  <div class="presets">
    <span class="preset" data-lat="35.6812" data-lon="139.7671">東京</span>
    <span class="preset" data-lat="34.6937" data-lon="135.5023">大阪</span>
    <span class="preset" data-lat="35.1815" data-lon="136.9066">名古屋</span>
    <span class="preset" data-lat="43.0618" data-lon="141.3545">札幌</span>
    <span class="preset" data-lat="33.5904" data-lon="130.4017">福岡</span>
    <span class="preset" data-lat="38.2682" data-lon="140.8694">仙台</span>
    <span class="preset" data-lat="26.2124" data-lon="127.6809">那覇</span>
  </div>

  <button id="btn-fetch-rasrf">🔍 rasrf タイルURLを捕捉（最重要）</button>
  <div id="out-rasrf" class="out">未実行</div>

  <button id="btn-fetch-targettimes">📋 利用可能なtargetTimesを探す</button>
  <div id="out-targettimes" class="out">未実行</div>

  <button id="btn-test-rasrf">🧪 rasrfタイルを実際に取得してみる</button>
  <div id="out-test" class="out">未実行</div>

  <script>
    const BASE = 'https://www.jma.go.jp/bosai/jmatile/data';
    const ZOOM = 10;

    function getCoords() {
      const lat = parseFloat(document.getElementById('input-lat').value);
      const lon = parseFloat(document.getElementById('input-lon').value);
      if (isNaN(lat) || isNaN(lon)) throw new Error('緯度・経度を正しく入力してください');
      return { lat, lon };
    }

    document.querySelectorAll('.preset').forEach((el) => {
      el.addEventListener('click', () => {
        document.getElementById('input-lat').value = el.dataset.lat;
        document.getElementById('input-lon').value = el.dataset.lon;
      });
    });

    document.getElementById('btn-geo').addEventListener('click', () => {
      if (!navigator.geolocation) { alert('位置情報を利用できません'); return; }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          document.getElementById('input-lat').value = pos.coords.latitude.toFixed(4);
          document.getElementById('input-lon').value = pos.coords.longitude.toFixed(4);
        },
        (err) => alert('位置情報取得失敗: ' + err.message),
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
      );
    });

    function lonLatToTile(lon, lat, z) {
      const n = 2 ** z;
      const x = Math.floor(((lon + 180) / 360) * n);
      const latRad = (lat * Math.PI) / 180;
      const y = Math.floor(
        ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n
      );
      return { x, y };
    }

    function utcStamp(d) {
      return (
        String(d.getUTCFullYear()) +
        String(d.getUTCMonth() + 1).padStart(2, '0') +
        String(d.getUTCDate()).padStart(2, '0') +
        String(d.getUTCHours()).padStart(2, '0') +
        String(d.getUTCMinutes()).padStart(2, '0') +
        String(d.getUTCSeconds()).padStart(2, '0')
      );
    }

    // ============================================================
    // ① rasrf タイルURLを捕捉
    // ============================================================
    document.getElementById('btn-fetch-rasrf').addEventListener('click', async () => {
      const out = document.getElementById('out-rasrf');
      out.textContent = '調査中…';
      const lines = [];

      try {
        const { lat, lon } = getCoords();
        const { x, y } = lonLatToTile(lon, lat, ZOOM);

        lines.push(`座標: ${lat}, ${lon}`);
        lines.push(`タイル: ${ZOOM}/${x}/${y}`);
        lines.push('');

        // 候補1: targetTimes_rasrf.json
        lines.push('--- 候補1: targetTimes_rasrf.json ---');
        try {
          const res = await fetch(`${BASE}/rasrf/targetTimes_rasrf.json`, { cache: 'no-store' });
          lines.push(`HTTP ${res.status}`);
          if (res.ok) {
            const json = await res.json();
            lines.push(`✅ 取得成功！件数: ${json.length}`);
            lines.push(`先頭3件:`);
            json.slice(0, 3).forEach((t, i) => lines.push(`  [${i}] ${JSON.stringify(t)}`));
          }
        } catch (e) { lines.push(`❌ ${e.message}`); }
        lines.push('');

        // 候補2: targetTimes.json
        lines.push('--- 候補2: rasrf/targetTimes.json ---');
        try {
          const res = await fetch(`${BASE}/rasrf/targetTimes.json`, { cache: 'no-store' });
          lines.push(`HTTP ${res.status}`);
          if (res.ok) {
            const json = await res.json();
            lines.push(`✅ 取得成功！件数: ${json.length}`);
            lines.push(`先頭3件:`);
            json.slice(0, 3).forEach((t, i) => lines.push(`  [${i}] ${JSON.stringify(t)}`));
          }
        } catch (e) { lines.push(`❌ ${e.message}`); }
        lines.push('');

        // 候補3: 現在時刻から推測してURLを生成
        lines.push('--- 候補3: 推測URLの存在確認 ---');
        const now = new Date();
        const baseHourMs = Math.floor(now.getTime() / 3600000) * 3600000;

        for (let h = 0; h <= 3; h++) {
          const btDate = new Date(baseHourMs - h * 3600000);
          const bt = utcStamp(btDate);
          const vtDate = new Date(btDate.getTime() + 3600000);
          const vt = utcStamp(vtDate);
          const url = `${BASE}/rasrf/${bt}/none/${vt}/surf/rasrf/${ZOOM}/${x}/${y}.png`;

          try {
            const res = await fetch(url, { cache: 'no-store', method: 'HEAD' });
            lines.push(`bt=${bt} → HTTP ${res.status} ${res.ok ? '✅' : '❌'}`);
          } catch (e) {
            lines.push(`bt=${bt} → ❌ ${e.message}`);
          }
        }

        out.textContent = lines.join('\n');
      } catch (e) {
        out.textContent = `❌ ${e.message}`;
      }
    });

    // ============================================================
    // ② 利用可能なtargetTimesを探す
    // ============================================================
    document.getElementById('btn-fetch-targettimes').addEventListener('click', async () => {
      const out = document.getElementById('out-targettimes');
      out.textContent = '調査中…';
      const lines = [];

      const urls = [
        `${BASE}/rasrf/targetTimes_rasrf.json`,
        `${BASE}/rasrf/targetTimes.json`,
        `${BASE}/nowc/targetTimes_N1.json`,
        `${BASE}/nowc/targetTimes_N2.json`,
        `${BASE}/kaikotan/targetTimes.json`,
      ];

      for (const url of urls) {
        lines.push(`--- ${url} ---`);
        try {
          const res = await fetch(url, { cache: 'no-store' });
          lines.push(`HTTP ${res.status}`);
          if (res.ok) {
            const text = await res.text();
            lines.push(`レスポンス長: ${text.length}`);
            lines.push(`先頭200文字: ${text.slice(0, 200)}`);
          }
        } catch (e) { lines.push(`❌ ${e.message}`); }
        lines.push('');
      }

      out.textContent = lines.join('\n');
    });

    // ============================================================
    // ③ rasrfタイルを実際に取得してみる
    // ============================================================
    document.getElementById('btn-test-rasrf').addEventListener('click', async () => {
      const out = document.getElementById('out-test');
      out.textContent = '取得中…';
      const lines = [];

      try {
        const { lat, lon } = getCoords();
        const { x, y } = lonLatToTile(lon, lat, ZOOM);

        // targetTimesから最新basetimeを取得（あれば）
        let basetime = null;
        try {
          const res = await fetch(`${BASE}/rasrf/targetTimes_rasrf.json`, { cache: 'no-store' });
          if (res.ok) {
            const json = await res.json();
            if (json.length > 0) {
              basetime = json.reduce((a, b) => (a.basetime > b.basetime ? a : b)).basetime;
              lines.push(`targetTimes_rasrf.jsonからbasetime: ${basetime}`);
            }
          }
        } catch (_) { /* ignore */ }

        if (!basetime) {
          const now = new Date();
          const baseHourMs = Math.floor(now.getTime() / 3600000) * 3600000;
          basetime = utcStamp(new Date(baseHourMs - 3 * 3600000));
          lines.push(`推測basetime: ${basetime}`);
        }

        const btDate = new Date(Date.UTC(
          +basetime.slice(0, 4), +basetime.slice(4, 6) - 1, +basetime.slice(6, 8),
          +basetime.slice(8, 10), +basetime.slice(10, 12), +(basetime.slice(12, 14) || 0)
        ));

        lines.push(`タイル座標: ${ZOOM}/${x}/${y}`);
        lines.push('');

        for (let h = 1; h <= 6; h++) {
          const vtDate = new Date(btDate.getTime() + h * 3600000);
          const vt = utcStamp(vtDate);
          const url = `${BASE}/rasrf/${basetime}/none/${vt}/surf/rasrf/${ZOOM}/${x}/${y}.png`;

          try {
            const res = await fetch(url, { cache: 'no-store' });
            lines.push(`+${h}h  ${vt}  HTTP ${res.status}  ${res.ok ? '✅' : '❌'}`);

            if (res.ok) {
              const blob = await res.blob();
              const objectUrl = URL.createObjectURL(blob);
              try {
                const img = await new Promise((resolve, reject) => {
                  const i = new Image();
                  i.onload = () => resolve(i);
                  i.onerror = () => reject(new Error('img fail'));
                  i.src = objectUrl;
                });
                const canvas = document.createElement('canvas');
                canvas.width = 256; canvas.height = 256;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0);
                const data = ctx.getImageData(128, 128, 1, 1).data;
                lines.push(`   RGBA(${data[0]},${data[1]},${data[2]},${data[3]})`);
              } finally { URL.revokeObjectURL(objectUrl); }
            }
          } catch (e) {
            lines.push(`+${h}h  ${vt}  ❌ ${e.message}`);
          }
        }

        out.textContent = lines.join('\n');
      } catch (e) {
        out.textContent = `❌ ${e.message}`;
      }
    });
  </script>
</body>
</html>
